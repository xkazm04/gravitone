apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gravitone.fullname" . }}
  labels:
    {{- include "gravitone.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.autoscaling.mode "off" }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gravitone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gravitone.selectorLabels" . | nindent 8 }}
      {{- if not .Values.apiKey.existingSecret }}
      annotations:
        # A rotated root key must reach running pods. The key arrives through
        # envFrom, which never changes the pod template, so without this a
        # `helm upgrade --set apiKey.value=...` rolled nothing and every pod
        # kept the old key. The checksum changes when the secret does, and the
        # changed template rolls the pods. Skipped for existingSecret: the chart
        # does not render that secret and cannot fingerprint it.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gravitone
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            # The scaling law: capacity comes from replicas, never from
            # in-process workers (the model is GIL-bound). Do not raise this.
            - name: TTS_WORKERS
              value: "1"
            - name: TTS_TORCH_THREADS
              value: {{ .Values.tts.torchThreads | quote }}
            - name: OMP_NUM_THREADS
              value: {{ .Values.tts.torchThreads | quote }}
            - name: TTS_QUEUE_MAX
              value: {{ .Values.tts.queueMax | quote }}
            # Must stay below terminationGracePeriodSeconds below.
            - name: TTS_DRAIN_TIMEOUT_S
              value: "20"
            - name: TTS_LANGUAGE
              value: {{ .Values.tts.language | quote }}
            - name: TTS_HOST
              value: "0.0.0.0"
            # Where the fleet lives: the headless peers Service, so /metrics can
            # sum the admission queue over every pod for the scaler.
            - name: TTS_FLEET_PEERS
              value: {{ printf "%s-peers.%s.svc" (include "gravitone.fullname" .) .Release.Namespace | quote }}
          envFrom:
            - secretRef:
                name: {{ include "gravitone.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # /health returns 503 until the model is loaded — exactly what
          # readiness wants. Liveness stays TCP so a long model (re)load
          # never gets the pod killed.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: voices
              mountPath: /app/voices
            # Ingest job workdirs + state.json. Without a mount the durability
            # design (persist -> rehydrate on restart) is dead code: the
            # directory lives in the pod's ephemeral layer and every restart
            # drops in-flight clone jobs.
            - name: ingest-jobs
              mountPath: /app/ingest_jobs
      # Longer than TTS_DRAIN_TIMEOUT_S (20s) so engine.stop() actually
      # finishes; the default 30s left no headroom once readiness flipped.
      terminationGracePeriodSeconds: 45
      volumes:
        - name: voices
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gravitone.fullname" . }}-voices
          {{- else }}
          emptyDir: {}
          {{- end }}
        # NOTE: emptyDir is per-POD, which is correct — ingest jobs are held in
        # the creating process's memory (JOBS) and are NOT shared between
        # replicas. See "Ingest is replica-affine" in deploy/README.md.
        - name: ingest-jobs
          emptyDir: {}
