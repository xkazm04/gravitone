{{- if eq .Values.autoscaling.mode "keda" }}
# 429-driven autoscaling: the engine's admission queue depth (the signal that
# precedes every 429) is polled straight from the JSON /metrics endpoint —
# no Prometheus required. Needs KEDA installed: https://keda.sh
#
# The value read is `fleet.queued`, NOT `metrics.queued`. The poll goes through
# the ClusterIP Service, which hands it to ONE pod; `metrics.queued` there is
# that pod's queue, a sample. `fleet.queued` is summed over every pod the
# headless peers Service names (service/fleet.py), so every pod answers the
# same total and KEDA's AverageValue (total / replicas) means what the target
# says: queued requests per replica.
#
# /metrics REQUIRES A CREDENTIAL when TTS_API_KEY is set (it publishes the
# deployment shape and live latency percentiles). This scaler runs in the KEDA
# operator pod and reaches the service over cluster DNS, so it is NOT loopback
# and cannot use the launcher's loopback exemption — it has to authenticate, or
# autoscaling silently stops while every other probe keeps passing. The
# TriggerAuthentication below hands it the same root key the pods already hold.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "gravitone.fullname" . }}-metrics
  labels:
    {{- include "gravitone.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: apiKey
      name: {{ include "gravitone.secretName" . }}
      key: TTS_API_KEY
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "gravitone.fullname" . }}
  labels:
    {{- include "gravitone.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "gravitone.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  pollingInterval: {{ .Values.autoscaling.keda.pollingInterval }}
  triggers:
    - type: metrics-api
      metadata:
        url: "http://{{ include "gravitone.fullname" . }}:{{ .Values.service.port }}/metrics"
        valueLocation: "fleet.queued"
        targetValue: {{ .Values.autoscaling.keda.queuedTarget | quote }}
        authMode: "apiKey"
        method: "header"
        keyParamName: "xi-api-key"
      authenticationRef:
        name: {{ include "gravitone.fullname" . }}-metrics
{{- end }}
